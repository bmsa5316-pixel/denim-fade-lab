<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DENIM FADE LAB</title>
  <meta name="description" content="デニムを同じ条件で撮影し、経年変化を記録するデータベース。">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="hero">
  <div class="wrap">
    <p class="eyebrow">DENIM FADE LAB / V1</p>
    <h1>デニムは、時間でどう変わる？</h1>
    <p>同じ場所・同じ構図・同じ条件で撮影し、色落ちと経年変化を長期記録します。</p>
  </div>
</header>

<main class="wrap">
  <section class="intro">
    <h2>現在の観測</h2>
    <p>まずは TCB 1890 No.2 SETUP からスタート。今後、Silverstone と EVISU を追加して比較できる構成にします。</p>
  </section>

  <section id="projects"></section>
</main>

<footer>
  <div class="wrap">DENIM FADE LAB — 経年変化の一次記録</div>
</footer>

<script>
async function loadData() {
  const res = await fetch('data/projects.json');
  const data = await res.json();
  const root = document.getElementById('projects');

  data.projects.forEach(project => {
    const latest = project.records[project.records.length - 1];
    const items = project.items.map(item => `
      <article class="item">
        <div class="image-box">
          <img src="${item.baseline_image}" alt="${project.model} ${item.type} BASELINE">
        </div>
        <div class="item-body">
          <span class="label">${item.type}</span>
          <h3>${project.model}</h3>
          <p>BASELINE：${project.baseline_date}</p>
          ${item.hem_note ? `<p class="small">${item.hem_note}</p>` : ''}
        </div>
      </article>
    `).join('');

    root.insertAdjacentHTML('beforeend', `
      <section class="project">
        <div class="project-head">
          <div>
            <p class="eyebrow">${project.brand}</p>
            <h2>${project.model}</h2>
            <p>${project.current_observation}</p>
          </div>
          <div class="stats">
            <div><b>開始</b><span>${project.start_date}</span></div>
            <div><b>着用</b><span>${project.wear_frequency}</span></div>
            <div><b>洗濯</b><span>Jacket ${project.wash_count_jacket} / Jeans ${project.wash_count_jeans}</span></div>
            <div><b>乾燥機</b><span>${project.dryer_count}回</span></div>
          </div>
        </div>

        <div class="timeline">
          <div class="timeline-point active">
            <strong>BASELINE</strong>
            <span>${latest.date}</span>
            <small>Day ${latest.day}</small>
          </div>
          <div class="timeline-point"><strong>DAY 30</strong><span>予定</span></div>
          <div class="timeline-point"><strong>DAY 90</strong><span>予定</span></div>
          <div class="timeline-point"><strong>DAY 180</strong><span>予定</span></div>
          <div class="timeline-point"><strong>DAY 365</strong><span>予定</span></div>
        </div>

        <div class="grid">${items}</div>

        <div class="record">
          <h3>BASELINE記録</h3>
          <dl>
            <dt>観測日</dt><dd>${latest.date}</dd>
            <dt>着用開始</dt><dd>${project.start_date}</dd>
            <dt>推定着用回数</dt><dd>${project.estimated_wears}</dd>
            <dt>洗濯</dt><dd>Jacket ${project.wash_count_jacket}回 / Jeans ${project.wash_count_jeans}回</dd>
            <dt>乾燥機</dt><dd>${project.dryer_count}回</dd>
            <dt>方法</dt><dd>${project.wash_method}</dd>
          </dl>
          <p>${latest.note}</p>
        </div>
      </section>
    `);
  });
}
loadData().catch(err => {
  document.getElementById('projects').innerHTML = '<p>データを読み込めませんでした。</p>';
  console.error(err);
});
</script>
</body>
</html>
